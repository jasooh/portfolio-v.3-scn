<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- drafting sheet: ink ground, hairline frame, a registration mark on each corner -->
  <rect width="512" height="512" fill="#0c0d10"/>
  <rect x="64" y="64" width="384" height="384" fill="none" stroke="#e9e6dd" stroke-opacity="0.18" stroke-width="4"/>
  <g stroke="#e9e6dd" stroke-opacity="0.55" stroke-width="5">
    <path d="M44 64h40M64 44v40M428 64h40M448 44v40M44 448h40M64 428v40M428 448h40M448 428v40"/>
  </g>
  <!-- the j: a slanted stem with a quarter-circle hook, and a square tittle -->
  <g transform="skewX(-10) translate(46 -22)">
    <rect x="252" y="128" width="48" height="48" fill="#e9e6dd"/>
    <path d="M276 206V330a78 78 0 0 1-78 78h-24" fill="none" stroke="#e9e6dd" stroke-width="48"/>
    <!-- the full stop, in the accent -->
    <rect x="330" y="360" width="48" height="48" fill="#a48bff"/>
  </g>
</svg>
